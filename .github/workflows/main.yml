name: Build Xuner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Xuner project
        run: |
          mkdir buildsrc
          unzip -o Xuner-Android-Project.zip -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xuner-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
